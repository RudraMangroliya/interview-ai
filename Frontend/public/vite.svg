<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#ai-grad-bg)" />
  
  <!-- Subtle overlay circle -->
  <circle cx="256" cy="180" r="170" fill="#FFFFFF" fill-opacity="0.08" />

  <!-- AI Sparkles Emblem -->
  <g filter="url(#shadow)">
    <!-- Primary Sparkle -->
    <path d="M256 90 C256 155, 301 200, 366 200 C301 200, 256 245, 256 310 C256 245, 211 200, 146 200 C211 200, 256 155, 256 90 Z" fill="#FFFFFF"/>
    
    <!-- Top-Right Sparkle -->
    <path d="M375 100 C375 125, 390 140, 415 140 C390 140, 375 155, 375 180 C375 155, 360 140, 335 140 C360 140, 375 125, 375 100 Z" fill="#F0ABFC"/>
    
    <!-- Bottom-Left Sparkle -->
    <path d="M145 290 C145 308, 157 320, 175 320 C157 320, 145 332, 145 350 C145 332, 133 320, 115 320 C133 320, 145 308, 145 290 Z" fill="#38BDF8"/>
  </g>

  <!-- Interview Mic Accent -->
  <path d="M200 370 C200 355, 212 342, 228 342 L284 342 C300 342, 312 355, 312 370 C312 400, 287 424, 256 424 C225 424, 200 400, 200 370 Z" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <path d="M256 424 L256 448 M220 448 L292 448" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
</svg>